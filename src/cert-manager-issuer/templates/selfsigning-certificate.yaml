{{- if .Values.selfsigned_installed }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-selfsigned-ca
# Define resources: https://cert-manager.io/docs/configuration/selfsigned/#bootstrapping-ca-issuers
# Create cert: https://docs.cert-manager.io/en/release-0.8/tasks/issuers/setup-ca.html
spec:
  isCA: true
  commonName: my-selfsigned-ca
  secretName: {{ .Values.selfsigned_secretname }}
  privateKey:
    algorithm: ECDSA
    size: 256
    # Set explicitly so key-rotation behavior is deliberate rather than inherited
    # from the cert-manager version's default (which changed to Always in v1.18).
    rotationPolicy: {{ .Values.selfsigned_ca_rotation_policy }}
  issuerRef:
    name: selfsigning-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
